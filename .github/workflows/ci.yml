name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx -r backend/requirements.txt

      - name: Run Pytest
        run: |
          pytest backend/tests/ -v

  docker:
    name: Verify Docker Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t rag-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t rag-frontend ./frontend

      - name: Verify Images Created
        run: |
          docker images rag-backend
          docker images rag-frontend